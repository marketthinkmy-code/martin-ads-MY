name: adbot · attach video to existing ad sets (manual)

# Attach ONE new Drive video as a PAUSED ad to one or more EXISTING ad sets, sharing a single
# creative across them (identical ads pool their social proof). SU-token path — the only channel
# that can upload the video file. The Drive file must be readable by the service account
# martin-ads-my@martin-as-my.iam.gserviceaccount.com (share the folder with it). Everything is
# created PAUSED; the operator reviews then activates.
#
# The push trigger fires ONLY on a spec file under scripts/attach_specs/** — the spec is the
# single "go" signal. The workflow yml and attach_video.py are deliberately NOT in the trigger
# paths, so this script/workflow can be committed and pushed on their own without firing a run
# (a spec-less run would fail and email a false "workflow failed" alert). Add the spec last, in
# its own push, for exactly one clean run. workflow_dispatch only works once this file is on the
# default branch. Paths are also isolated so a push here never re-fires the creative-test /
# upload-ad builds.

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "path to the attach spec JSON"
        type: string
        required: false
        default: "scripts/attach_specs/may_v15.json"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - "scripts/attach_specs/**"

concurrency:
  group: adbot-attach-video
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Attach video to ad sets (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_SPEC: ${{ inputs.spec_path || 'scripts/attach_specs/may_v15.json' }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: python scripts/attach_video.py
