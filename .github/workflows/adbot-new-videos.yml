name: adbot · Sept 15-video rebuild status (manual, read-only)

# Manual, read-only: spend / registrations / CPL since launch for the 15 new creatives across the
# three 1-15-15 campaigns, pooled per creative and per audience, plus every ad set's status and
# budget. No writes.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "count spend from this date (YYYY-MM-DD)"
        type: string
        required: false
        default: "2026-09-15"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-new-videos.yml"
      - "scripts/new_videos_status.py"

concurrency:
  group: adbot-new-videos
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: New videos status
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_SINCE: ${{ inputs.since || '2026-09-15' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/new_videos_status.py
