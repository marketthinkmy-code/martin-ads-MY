name: adbot · sheet structure probe (read-only)

# Tab titles, row counts and header rows only — never a data row.

on:
  workflow_dispatch:
    inputs:
      sheet_id:
        description: "workbook id to describe"
        type: string
        required: false
        default: "1h9ikVAQiiso4UtF1ncMaRtWzqSGidUAOdF4oyLpY05Q"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-probe-sheet.yml"
      - "scripts/probe_sheet_structure.py"

concurrency:
  group: adbot-probe-sheet
  cancel-in-progress: false

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Describe tabs
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_PROBE_SHEET_ID: ${{ inputs.sheet_id || '1h9ikVAQiiso4UtF1ncMaRtWzqSGidUAOdF4oyLpY05Q' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/probe_sheet_structure.py
