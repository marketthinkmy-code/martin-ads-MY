name: adbot · clone a creative line-up to a new audience (manual)

# Build a new CBO campaign + ad set that clones a proven ad set's targeting and re-runs creatives
# that ALREADY exist in the account (by creative_id) — no Drive download, no video re-upload, and
# the ads keep pooling social proof with their twins. SU-token path. Everything PAUSED; the
# operator activates after review.
#
# Isolated spec dir (scripts/clone_specs/**) so a push here fires ONLY this workflow.

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "path to the clone spec JSON"
        type: string
        required: false
        default: "scripts/clone_specs/aug_a_diet.json"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - "scripts/clone_specs/**"

concurrency:
  group: adbot-clone-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      # The August batch: 10 clips off one shared evergreen body, split into three themed
      # campaigns on the same F&R audience. Leaving finished specs wired up here would
      # rebuild them as duplicates on the next push, so this list is rewritten each time.
      - name: Build 1-1-4 — 饮食吸收
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_SPEC: scripts/clone_specs/aug_a_diet.json
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/clone_test.py
      - name: Build 1-1-3 — 生理体质
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_SPEC: scripts/clone_specs/aug_b_physio.json
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/clone_test.py
      - name: Build 1-1-3 — 观念打破
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_SPEC: scripts/clone_specs/aug_c_mythbust.json
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/clone_test.py
