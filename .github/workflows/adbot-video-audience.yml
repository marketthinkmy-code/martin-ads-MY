name: adbot · build video-viewer retargeting audience (manual)

# Creates ONE engagement custom audience: people who watched >= N% of the page's videos in the
# last D days, for a retargeting ad set aimed at viewers who never registered. Tries the known
# rule is the per-video list Meta itself stores (see the script header); the account's existing
# video audiences are printed and their videos folded in, so the new audience is a superset.
# Dispatch only: the self-path push trigger used to register the workflow was removed after the
# first audience (run 35683071793, audience 120248996628200575) so an edit cannot build a duplicate.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "audience name"
        type: string
        required: false
        default: "MY · 看过视频25%+ · 30天 · retarget"
      percent:
        description: "minimum watched share: 25 / 50 / 75 / 95"
        type: string
        required: false
        default: "25"
      days:
        description: "retention window in days"
        type: string
        required: false
        default: "30"
      video_ids:
        description: "comma-separated video ids (default: the Sept batch + Hooks 0907 videos)"
        type: string
        required: false
        default: ""
      ad_ids:
        description: "comma-separated ad ids whose creatives' videos are added (default: the winners)"
        type: string
        required: false
        default: ""
      include_existing:
        description: "1 = also include every video already in the account's video-engagement audiences"
        type: string
        required: false
        default: "1"

concurrency:
  group: adbot-video-audience
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build video-viewer audience
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_CA_NAME: ${{ inputs.name || 'MY · 看过视频25%+ · 30天 · retarget' }}
          ADBOT_PAGE_ID: "341825319024143"
          ADBOT_PERCENT: ${{ inputs.percent || '25' }}
          ADBOT_DAYS: ${{ inputs.days || '30' }}
          ADBOT_VIDEO_IDS: ${{ inputs.video_ids || '1052528697565401,1398283575826508,28243236788661855,1637727024807210,2087125188552451,4531608200422428,1339021274973268,28454428894192354,2527523231102000,1345240087425405,1414935953438957,2955256434830947,1057763826883508,1093468549952879,1792368755409296,1850013596359372,1712029859905096,1621474816346348' }}
          ADBOT_AD_IDS: ${{ inputs.ad_ids || '120247917149920575,120247917149020575,120248824512940575,120248670448040575' }}
          ADBOT_INCLUDE_EXISTING: ${{ inputs.include_existing || '1' }}
          ADBOT_CREATIVE_SPECS: "scripts/clone_specs/sept15x15_fnr.json,scripts/clone_specs/sept5_test_fnr.json"
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/create_video_audience.py
