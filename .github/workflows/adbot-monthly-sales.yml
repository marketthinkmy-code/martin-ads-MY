name: adbot · monthly MY sales analysis (manual)

# Read-only: month-by-month MY paid sales + the ads that converted, straight from the Paid
# Student List. The workbook is shared MY/SG, so each row's market is resolved by tag first and
# then by matching its names against the live MY account inventory; anything still unplaced is
# printed rather than guessed. No writes.
#
# Push trigger fires on THIS file and its script only — isolated from every other workflow.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-monthly-sales.yml"
      - "scripts/monthly_sales.py"

concurrency:
  group: adbot-monthly-sales
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Monthly MY sales
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/monthly_sales.py

# Run: 2026-08-13 — post 08-12 webinar MY monthly figures.
