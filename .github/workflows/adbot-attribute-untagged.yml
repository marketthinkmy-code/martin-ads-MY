name: adbot · untagged sales -> registration UTM (read-only)

# Joins untagged sales to the Register tab in memory on phone/email and prints only dates and
# UTM tags (Meta object names) — never names, phones or emails.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "look back this many days"
        type: string
        required: false
        default: "7"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-attribute-untagged.yml"
      - "scripts/attribute_untagged.py"

concurrency:
  group: adbot-attribute-untagged
  cancel-in-progress: false

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Match untagged sales
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_DAYS: ${{ inputs.days || '7' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/attribute_untagged.py
