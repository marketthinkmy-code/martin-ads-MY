name: adbot · resolve a post/reel into an object_story_id (manual)

# Read-only lookup: turn a facebook.com post or reel URL into the `<page>_<post>` id an ad
# creative needs, and say whether Meta considers it promotable. A reel URL carries its video id,
# which is not reliably the same number as its page-post id — so this asks rather than guesses.
#
# Push trigger fires on THIS file and its script only.

on:
  workflow_dispatch:
    inputs:
      post_ref:
        description: "facebook.com URL or bare numeric id"
        type: string
        required: true
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-resolve-post.yml"
      - "scripts/resolve_post.py"

concurrency:
  group: adbot-resolve-post
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Resolve
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ADBOT_POST_REF: ${{ inputs.post_ref || 'https://www.facebook.com/reel/1811537966511148' }}
        run: python scripts/resolve_post.py
