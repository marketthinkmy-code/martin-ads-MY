name: adbot · active ads CPL + MY-only CPA (manual, read-only)

# Every ACTIVE ad's CPL (14d / 30d) and MY-only CPA from the Paid Student List, matched by
# creative name with all copies pooled, plus a pause / lower / keep suggestion per ad.
# Nothing is written. Push trigger fires on THIS file and its script only. (A new workflow's
# FIRST push must not carry a skip-ci marker anywhere in the commit message.)

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-active-cpl-cpa.yml"
      - "scripts/active_ads_cpl_cpa.py"

concurrency:
  group: adbot-active-cpl-cpa
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Active ads CPL + CPA
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/active_ads_cpl_cpa.py
