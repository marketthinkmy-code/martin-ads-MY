name: adbot · new vs old lead buyers (read-only)

# Classifies each recent buyer as a new lead from this round's ads or a returning old lead.
# Phone/email are in-memory join keys only; output is dates, counts and ad names.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "first sale date to include (YYYY-MM-DD)"
        type: string
        required: false
        default: "2026-09-01"
      new_days:
        description: "first registered within this many days before buying = NEW"
        type: string
        required: false
        default: "14"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-new-vs-old.yml"
      - "scripts/new_vs_old_buyers.py"

concurrency:
  group: adbot-new-vs-old
  cancel-in-progress: false

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Classify buyers
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_SINCE: ${{ inputs.since || '2026-09-01' }}
          ADBOT_NEW_DAYS: ${{ inputs.new_days || '14' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/new_vs_old_buyers.py
