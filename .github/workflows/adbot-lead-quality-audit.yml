name: adbot · MY lead-quality audit from GHL survey score (read-only)

# Register-tab survey/score audit for verified MY leads. Aggregates only; never prints a person.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "first registration date (YYYY-MM-DD); empty = first date with scores"
        type: string
        required: false
        default: ""
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-lead-quality-audit.yml"
      - "scripts/lead_quality_audit.py"

concurrency:
  group: adbot-lead-quality-audit
  cancel-in-progress: false

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Audit
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_SINCE: ${{ inputs.since || '' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/lead_quality_audit.py
