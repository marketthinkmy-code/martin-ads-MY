name: adbot · pause entities (manual)

# Pause specific campaigns / ad sets / ads by id via the adbot system-user token — the mirror of
# adbot-activate. Needed when the interactive Meta connector refuses an edit for a reason that has
# nothing to do with stopping delivery (e.g. "reel contains licensed music", which blocks the ad
# edit entirely). The SU path writes status straight through the Graph API. Per-entity failures are
# isolated. Dispatch with a comma-separated id list; the push trigger runs the ids baked in below
# (2026-07-28: Video 2 - 一个3～15岁正常健康的孩子, 60d 0 sales, connector-blocked).

on:
  workflow_dispatch:
    inputs:
      entity_ids:
        description: "comma-separated campaign / ad set / ad ids to set PAUSED"
        type: string
        required: true
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-pause.yml"
      - "scripts/pause_entities.py"

concurrency:
  group: adbot-pause
  cancel-in-progress: false

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Pause entities
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # 2026-08-05:
          #  · 120247592538940575  JAN Video 10: 马六甲 — 60d RM1,339 / 16 regs / 0 paid.
          #    CPL RM42 keeps it under the RM55 monitor, but it is past the RM1,300 CPA hard-stop.
          #  · the four below sit in "MARTIN-MY | 营养·方向错了", ad-level ACTIVE and held off only
          #    by the paused campaign. Pausing them first means re-opening that campaign for the
          #    ROAS-6.4x winner lights up ONE ad, not five.
          ADBOT_PAUSE_IDS: ${{ inputs.entity_ids || '120247592538940575,120246582179190575,120246607660560575,120246599822020575,120246582176970575' }}
        run: python scripts/pause_entities.py
