name: adbot · Phase 3 nov11 attendance × survey × sales (read-only)

# Read-only join of Register (webinar_nov11), Zoom attendance row numbers, Paid Student List and MY Meta spend.
# Aggregates and sheet row numbers only; never prints a person.

on:
  workflow_dispatch:
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-phase3-nov11.yml"
      - "scripts/phase3_nov11.py"
      - "scripts/phase3/**"

concurrency:
  group: adbot-phase3-nov11
  cancel-in-progress: false

jobs:
  phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Phase 3
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/phase3_nov11.py
