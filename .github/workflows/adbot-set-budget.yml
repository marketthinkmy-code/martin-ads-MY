name: adbot · set daily budget (manual)

# Change a campaign's / ad set's daily budget WITHOUT stopping delivery. The interactive
# connector's ads_update_entity force-pauses whatever it edits, so budget changes must go through
# the system-user token instead. Status is never written here.
#
# Push trigger fires on THIS file and its script only — isolated from every other workflow.

on:
  workflow_dispatch:
    inputs:
      budget_spec:
        description: "comma-separated <entity_id>=<MYR per day> pairs"
        type: string
        required: true
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-set-budget.yml"
      - "scripts/set_budget.py"

concurrency:
  group: adbot-set-budget
  cancel-in-progress: false

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Set daily budgets
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # 2026-08-13: after the 08-12 webinar, follow the CPA rather than the CPL.
          #  · 120247917148460575  F&R Top 5 Winners 1-1-5      RM150 -> RM250
          #      H2 面包牛奶 took 2 MY sales on RM1,404 = CPA RM702, the best in the account.
          #  · 120247592375550575  Food & Drink + Milk 1-1-3    RM100 -> RM150
          #      马六甲 2 MY sales, CPA RM921, CPL down to RM37 on 50 registrations. Its two
          #      ad-set siblings are paused, so the whole budget reaches it.
          #  · 120247433765670575  Scale CBO - Winners          RM200 -> RM100
          #      Reversing the 08-07 raise: ~RM3,900 of 30d spend returned one MY sale, and that
          #      converter (H2 Hook) sits at CPA RM1,657 — past the RM1,300 hard-stop.
          ADBOT_BUDGET_SPEC: ${{ inputs.budget_spec || '120247917148460575=250,120247592375550575=150,120247433765670575=100' }}
        run: python scripts/set_budget.py
