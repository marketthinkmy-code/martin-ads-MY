name: adbot · set daily budget (manual)

# Change a campaign's / ad set's daily budget WITHOUT stopping delivery. The interactive
# connector's ads_update_entity force-pauses whatever it edits, so budget changes must go through
# the system-user token instead. Status is never written here.
#
# Push trigger fires on THIS file and its script only — isolated from every other workflow.

on:
  workflow_dispatch:
    inputs:
      budget_spec:
        description: "comma-separated <entity_id>=<MYR per day> pairs"
        type: string
        required: true
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-set-budget.yml"
      - "scripts/set_budget.py"

concurrency:
  group: adbot-set-budget
  cancel-in-progress: false

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Set daily budgets
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # 2026-08-07b: move budget off the idling campaigns and onto the cheap registrations.
          # July's problem was nine campaigns with one sale each and no scale, while the RM13-33
          # CPL ads sat in RM100/day boxes they could not grow out of.
          #  · 120247433765670575  Scale CBO - Winners Hook-Matched  RM100 -> RM200
          #      孩子15岁以上 CPL33 · H2 面包牛奶 Hook CPL24 · H2 早餐卡 CPL32 — all three well
          #      under the RM55 threshold, and this is the ported-SG-winner campaign.
          #  · 120247917148460575  F&R Top 5 Winners 1-1-5           RM100 -> RM150
          #      什麼樣的孩子 CPL13.81 and 孩子15岁以上 CPL22.89 — the cheapest in the account.
          #  · 120246581925510575  基因决定论                        RM100 -> RM150
          #      林书豪 CPL29, best of the large spenders; 爸妈165突破175 converted in July.
          ADBOT_BUDGET_SPEC: ${{ inputs.budget_spec || '120247433765670575=200,120247917148460575=150,120246581925510575=150' }}
        run: python scripts/set_budget.py
