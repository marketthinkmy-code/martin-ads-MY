name: adbot · activate entities (manual)

# Re-activate specific campaigns / ad sets / ads by id via the adbot system-user token —
# the same credential weekly ON/OFF and the monitor write with. Useful when the operator's
# interactive identity is advertising-restricted but the SU is healthy. Dispatch with a
# comma-separated id list; the push trigger runs the ids baked into env below (the
# 2026-07-27 SG-winner port: turn on the 3 proven SG winners sitting PAUSED in "MARTIN-MY |
# Scale CBO - Winners Hook-Matched" — 什麼樣的孩子 (120247434321780575), 孩子15岁以上
# (120247434066040575), H2 面包牛奶一点都不健康 (120247434289860575) — plus their ad set
# 120247433845320575. They are cpl_hold-protected on main (PR #16) so the monitor gives them a
# runway to accrue MY sales under this campaign before CPA-rescue can take over).

on:
  workflow_dispatch:
    inputs:
      entity_ids:
        description: "comma-separated campaign / ad set / ad ids to set ACTIVE"
        type: string
        required: true
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-activate.yml"
      - "scripts/activate_entities.py"

concurrency:
  group: adbot-activate
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Activate entities
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # 2026-08-20: open 被饿死的赢家 1-3-1 (ABO confirmed by the operator) — campaign,
          # its three RM100/day ad sets, and the one ad in each. Budgets are fixed per ad set
          # with sharing off, so none of the three proven buyers can be starved again.
          ADBOT_ACTIVATE_IDS: ${{ inputs.entity_ids || '120248464922520575,120248464922720575,120248464923350575,120248464923830575,120248464924760575,120248464925350575,120248464925950575' }}
        run: python scripts/activate_entities.py
