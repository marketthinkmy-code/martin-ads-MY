name: adbot · resolve ads to their page posts (manual)

# Read-only: prints the page post (effective_object_story_id) behind each listed ad, in MY or
# SG — both accounts share one page, so a proven ad from either can be rebuilt in MY against
# the same post and keep its pooled engagement. Feeds clone_test's post_id route. No writes.
#
# Push trigger fires on THIS file and its script only — isolated from every other workflow.

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "resolve spec JSON, repo-relative"
        type: string
        required: false
        default: "scripts/resolve_specs/top13.json"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-resolve-posts.yml"
      - "scripts/resolve_posts.py"

concurrency:
  group: adbot-resolve-posts
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Resolve posts
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ADBOT_RESOLVE_SPEC: ${{ inputs.spec_path || 'scripts/resolve_specs/top13.json' }}
        run: python scripts/resolve_posts.py
