name: adbot · set ad set start time (manual)

# Set a future start_time so an ad set begins delivering on its own at a chosen moment. Status is
# never written here — schedule first, verify the time came back, THEN activate. A live ad set
# with no start date spends straight away, which is the mistake this ordering exists to prevent.
#
# Push trigger fires on THIS file and its script only — isolated from every other workflow.

on:
  workflow_dispatch:
    inputs:
      schedule_spec:
        description: "comma-separated <entity_id>=<ISO start with offset>[|<ISO end>]"
        type: string
        required: true
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-schedule.yml"
      - "scripts/set_schedule.py"

concurrency:
  group: adbot-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Set start times
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # 2026-08-18: LAL Paid List 1-5% ad set — start at midnight 20 Aug, account time
          # (GMT+8). Two days out also gives the five lookalike bands time to finish building.
          ADBOT_SCHEDULE_SPEC: ${{ inputs.schedule_spec || '120248429838370575=2026-08-20T00:00:00+08:00' }}
        run: python scripts/set_schedule.py
