name: adbot · front-end vs back-end revenue per buyer (read-only)

# Joins front-end buyers to the back-end tabs in memory on phone/email; prints counts and sums only.

on:
  workflow_dispatch:
    inputs:
      market:
        description: "MY / SG / ALL (front-end buyers by phone country)"
        type: string
        required: false
        default: "MY"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-backend-ltv.yml"
      - "scripts/backend_ltv.py"

concurrency:
  group: adbot-backend-ltv
  cancel-in-progress: false

jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Front vs back end
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_MARKET: ${{ inputs.market || 'MY' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/backend_ltv.py
