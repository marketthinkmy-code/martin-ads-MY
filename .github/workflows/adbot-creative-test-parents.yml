name: adbot · build creative-test (Parents V11+V13)

# Build a 1-1-2 creative test: 2 new videos in ONE new CBO campaign that CLONES the
# "Advantage+ Parents + Engaged" ad set's targeting (source 120247591888380575) and runs each
# video as its own ad. SU-token path — the only channel that can upload the video files.
# Everything PAUSED; the operator activates after review.
#
# Isolated spec dir (scripts/ct_specs/**) so a push here fires ONLY this workflow — it never
# touches scripts/ad_specs/** (which would re-fire creative-test + upload-ad) or attach_specs/**.
# The spec is the single "go" signal; push the spec + body files together for one clean run.

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "path to the creative-test spec JSON"
        type: string
        required: false
        default: "scripts/ct_specs/parents_v11_v13.json"
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - "scripts/ct_specs/**"

concurrency:
  group: adbot-creative-test-parents
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build creative-test (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_SPEC: ${{ inputs.spec_path || 'scripts/ct_specs/parents_v11_v13.json' }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: python scripts/build_creative_test.py
