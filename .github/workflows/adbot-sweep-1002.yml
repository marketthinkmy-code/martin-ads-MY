name: adbot · MY sweep 30Sep-2Oct (manual)

# MUTATING, operator-ordered ("my 30sep-2oct，超过 70cpl 没有 lead 的都关掉"):
# pause every active ad whose window CPL > RM70 or with zero leads on >= RM30 spend;
# log the keepers (CPL <= 70 with leads) with post ids for the SG rebuild. Idempotent.

on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Sweep
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sweep_1002.py
      - name: Persist state
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: persist 10/2 sweep record [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
