name: adbot · paid-in-30d creatives that are OFF (manual, read-only)

# Manual, read-only: every creative with a MY sale in the last 30 days, its pooled CPA30 / CPA60 /
# CPL30 across all copies in this account, and whether any copy is still running — so a creative
# paused on CPL but still paying on CPA can be re-opened where it converted. No writes.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - ".github/workflows/adbot-qualified-off.yml"
      - "scripts/qualified_but_off.py"

concurrency:
  group: adbot-qualified-off
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Paid-in-30d creatives that are OFF
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/qualified_but_off.py
