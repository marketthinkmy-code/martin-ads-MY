name: adbot · set placements (manual)

# Switch ad sets to manual placements through the system-user token — the interactive connector's
# ads_update_entity force-pauses whatever it edits. Only the placement keys change; audience,
# budget, status and the Malaysia declaration are left exactly as they are (scripts/set_placements.py).
# Two routes: manual dispatch with inputs, or a push of scripts/placement_specs/pending.json on the
# working branch (GitHub does not expose a new workflow to API dispatch until it is on the default
# branch or has run once). The push route reads ONLY that spec file; code changes never run it.

on:
  push:
    branches: ["claude/sweet-curie-b6vql4"]
    paths:
      - "scripts/placement_specs/pending.json"
  workflow_dispatch:
    inputs:
      adset_ids:
        description: "comma-separated ad set ids"
        type: string
        required: true
      preset:
        description: "fb_feed_instream_reels | fb_feed_instream | fb_feed"
        type: string
        required: false
        default: "fb_feed_instream_reels"
      dry_run:
        description: "print before/after, write nothing"
        type: boolean
        required: false
        default: false

concurrency:
  group: adbot-set-placements
  cancel-in-progress: false

jobs:
  placements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Set placements
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ADBOT_PLACEMENT_ADSETS: ${{ inputs.adset_ids || '' }}
          ADBOT_PLACEMENT_PRESET: ${{ inputs.preset || 'fb_feed_instream_reels' }}
          ADBOT_PLACEMENT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ADBOT_PLACEMENT_SPEC_FILE: scripts/placement_specs/pending.json
        run: python scripts/set_placements.py
