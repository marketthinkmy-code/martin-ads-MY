# ─────────────────────────────────────────────────────────────────────────────
# adbot — non-secret operator config for martin-ads-MY
# Brand: Martin MY ·《儿童长高方程式》· 馬丁醫師 (kids-growth conditioning course)
# Secrets live in .env (see .env.example).  `python -m adbot doctor` validates this file.
#
# Confirmed SAME as the soocheng template: country MY · currency MYR · timezone GMT+8 ·
# language Chinese (locale 1004) · objective OUTCOME_SALES / OFFSITE_CONVERSIONS /
# COMPLETE_REGISTRATION.  cron schedules in .github/workflows are UNCHANGED.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  ad_account_id: "act_1011719073600566"   # Martin MY ad account
  page_id: "341825319024143"               # FB Page the ads run under
  instagram_user_id: null                  # @martinyaoshi (7085012808290550) is the right IG, but it must be ASSIGNED TO THIS AD ACCOUNT (Business Settings -> Accounts -> Instagram) before it works as an explicit actor (app is already Live; that wasn't the cause). Omitted for now -> IG placements run via the 马丁医师 Page's linked IG. Restore the id once the IG is assigned to the ad account.
  pixel_id: "1189593242351293"             # pixel / dataset id for conversion tracking

  objective: "OUTCOME_SALES"             # confirmed same as template
  optimization_goal: "OFFSITE_CONVERSIONS"   # "Maximize number of conversions"
  conversion_event: "COMPLETE_REGISTRATION"  # Ads Manager "Complete registration" (custom_event_type)
  special_ad_categories: []              # none (kids-growth education — not a restricted category)

  lead_destination:
    type: "WEBSITE"                      # WEBSITE | INSTANT_FORM | MESSENGER | WHATSAPP
    link_url: "https://as.dr-martin.com.tw/kids-growth-formula-landing"
  conversion_domain: "https://as.dr-martin.com.tw/"   # bare domain derived = as.dr-martin.com.tw (verify it in Meta Business settings)
  call_to_action: "LEARN_MORE"           # SIGN_UP / LEARN_MORE / GET_OFFER / SUBSCRIBE ...
  url_tags: "utm_source={{adset.name}}&utm_medium={{placement}}&utm_campaign={{campaign.name}}&utm_content={{ad.name}}"

  budget:
    level: "CAMPAIGN"                    # CBO — campaign-level budget
    daily_amount_myr: 250                # CBO daily budget (MYR)
    currency: "MYR"                      # confirmed same
    adset_min_spend_myr: 50              # per-ad-set minimum daily spend (>=50)

  targeting:
    # Mirrors the operator's live ad set (see docs/adset_targeting.md). Advantage+ audience ON
    # makes age a SUGGESTION (min 25), not a hard cap — do NOT raise age_min as a hard floor here
    # or Meta rejects it ("add a higher minimum age as a suggestion instead").
    countries: ["MY"]                    # confirmed same
    age_min: 25                          # Advantage+ suggestion floor (not a hard cap)
    age_max: 65
    advantage_audience: 1                # Advantage+ audience ON (broad; Meta expands beyond the age suggestion)
    locales: [1004]                      # confirmed same — 1004 = Chinese (All)
    excluded_custom_audiences:           # exclude existing leads + paid customers (reach fresh prospects)
      - "120224052749710575"             # 马丁 15days complete registration (website/pixel CA)
      - "120242141920810575"             # MARTIN MYSG PAID CUSTOMER - 13 APR (customer list)

  build:
    creatives_per_adset: 10              # the "N" in 1-1-N
    activate_after_build: false          # SAFETY: batch builds create everything PAUSED — you activate after review (no spend until then)

naming:
  prefix: "MARTIN-MY"                    # name prefix scoping every entity this bot creates
  weekly_off_label: "ADBOT_WEEKLY_OFF"   # structural — do not change

drive:
  # Curated 1-1-10 set "MARTIN-MY ADBOT 1-1-10 (JUNE)" (assembled from your archives;
  # lives inside "JUNE 2" so the SA inherits read access): 6 videos + 3 single images +
  # 1 CAROUSEL subfolder (6 cards) = 10 creative units.
  creatives_folder_id: "1XTztY2xvAKY0YfZW3spZi3ZEKqu3lHlF"
  carousel_subfolder_marker: "carousel"     # matches the CAROUSEL subfolder
  script_sidecar_ext: ".txt"                # optional per-asset .txt brief (same basename)

google_docs:
  caption_log_doc_id: ""                 # empty -> auto-create on first write
  idea_backlog_doc_id: ""                # empty -> auto-create on first write

notion:                                  # Notion content DB = single source of truth for ad copy
  enabled: true                          # needs NOTION_API_KEY (repo secret) + DB shared with the integration
  database_id: "4bb82b42449682c294e881448aa21435"   # 🎬 MARTIN Content Pipeline Template
  brand: "Martin MY"
  default_status: "In Review"            # Status set on each new row (Idea/Draft/In Review/Approved/Published)
  default_type: "Caption"                # Type when kind isn't video/carousel/single_image
  captions_source: true                  # build READS caption+headline FROM Notion (by Content ID) — no second LLM version
  require_status: ""                      # use the Notion row regardless of Status (operator: no Approved gate — use directly)

kpi:
  cpl_threshold_myr: 55.00               # pause an ad above this CPL (MYR)
  cpl_min_spend_myr: 100.00              # only judge an ad once it has spent >= this (MYR)
  cpl_lookback: "week_thu"               # week-to-date from Thursday (the weekly ON/reset)
  pause_zero_lead_after_spend: true      # spent >= cpl_min_spend with 0 results -> infinite CPL -> pause
  cpl_grace_days: 7                      # a new ad younger than this is exempt from CPL-only pauses — its webinar registrants haven't had time to convert to a paid sale yet (zero-lead + CPA hard-stop still pause)
  # Sales only ever close on a webinar night, so "has this ad had its chance?" is counted in
  # webinars, not days — an ad born the day after one waits six days for its first shot, an ad born
  # the day before gets it immediately, and calendar age cannot tell those apart. This is what
  # 马六甲 cost: paused on 08-05 at noon for "RM1,281 / 0 sales", it took 2 sales that same evening.
  # settle_days covers the paid list being filled in by hand after the webinar runs.
  webinar_weekday: 2                     # Mon=0 .. Wed=2 — the weekly webinar
  cpl_grace_webinars: 1                  # an ad must sit through this many before CPL can pause it
  webinar_settle_days: 1                 # wait this long after a webinar before counting it
  # Lead-quality gate: this many 60-day registrations with ZERO matched paid sales pauses the ad
  # no matter how pretty its CPL is. Registration-optimised delivery rewards exactly the hooks
  # that attract non-buyers (their sign-ups are cheapest) — 早餐卡长高 reached CPL RM48 on 64
  # sign-ups and not one buyer. The webinar grace still applies first: an ad that has not sat
  # through a webinar is not judged.
  lead_quality_min_regs: 30
  # Brakes on that grace, so a young ad can't burn unchecked (Hook 4 reached CPL 93 / ~RM1,200 with
  # 0 sales while "protected"). Both only ever fire on an ad with ZERO matched paid sales — one with
  # real sales at an acceptable CPA is kept by CPA-rescue, which runs first and wins.
  cpl_grace_max_cpl_multiple: 1.5        # CPL above 1.5x the threshold (= RM82.50) -> grace off, pause now
  cpl_grace_max_spend_myr: 500.00        # spent this much with 0 sales -> grace off, pause now
  # Reviewed 2026-08-13, after the runway these three were given (08-05 and 08-12 webinars):
  #   面包牛奶一点都不健康  2 MY sales, CPA RM702  -> graduated; CPA-rescue now protects it and the
  #                                                 hold is redundant.
  #   什麼樣的孩子          RM1,619 across two campaigns, 0 MY sales -> failed.
  #   孩子15岁以上          RM1,497 across two campaigns, 0 MY sales -> failed.
  # A hold is a promise to look again, not a permanent exemption — all three are handed back to the
  # monitor. Re-add a name here only with a fresh review date attached.
  cpl_hold: []                           # ad-name substrings temporarily exempt from auto-pause

cpa:                                     # cost per real PAID acquisition (joins the paid-list sheet)
  enabled: true
  spreadsheet_id: "1DsKtcDpsWp3Njfah6Fw3PBizhGiy017ULw5qKeV-RSA"   # "Paid Student List" sheet (share with the SA email)
  sales_tab: "Paid Student List (RM1997)"   # NOTE: tab label says RM1997 but price_myr below is 2591 — confirm
  price_myr: 2591.00                     # default pax price (sheet's Amount column overrides per row)
  # Operator's CPA bands (2026-09-03, RM2,591 price): <=target Strong (the only band that may
  # climb the RM50->80->100->150 scale ladder — scaling itself stays manual); target..healthy_max
  # Healthy (keep running, no scale); healthy_max..max_acceptable Warning (no scale, watch);
  # max_acceptable..hard_stop Unhealthy (auto-paused once a full webinar + settle cycle passes
  # since its last sale with no new one); >hard_stop pauses outright once matured.
  target_myr: 740.00                     # primary target CPA
  healthy_max_myr: 860.00                # end of healthy range (NOT an auto-pause line)
  max_acceptable_myr: 1040.00            # above here -> unhealthy: paused after a saleless full webinar cycle
  hard_stop_myr: 1300.00                 # above here (with real sales, matured) -> auto-pause
  conversion_days: 14                    # don't judge CPA / 'no sales' until this old
  min_spend_myr: 1000.00                 # need >= this spend before a CPA verdict is fair

schedule:                                # informational; the real schedule lives in .github/workflows (UNCHANGED)
  timezone: "Asia/Kuala_Lumpur"          # GMT+8 (no DST) — confirmed same
  weekly_off: { day: "WED", time: "15:00" }   # pause ALL            -> workflow cron 9 7 * * 3 (+16:09 backup)
  weekly_on:  { day: "THU", time: "00:00" }   # resume what Wed paused -> workflow cron 9 16 * * 3 (+ backups)
  monitor_interval_hours: 1
